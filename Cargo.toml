[package]
name = "unidpp-console"
description = "The UniDPP admin console: one branded pane over a deployment — health, the operator manifest (edit + validate + preview), the registry's items, the issuer's passports, and inline pack verification"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unidpp/unidpp-console"
rust-version = "1.75"

[dependencies]
unidpp-config = { path = "../unidpp-config" }
unidpp-cli = { path = "../unidpp-cli" }
unidpp-signatif = { path = "../unidpp-signatif", features = ["sm2", "ml-dsa"] }
unidpp-model = { path = "../unidpp-core/crates/model" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[dev-dependencies]
serde_yaml = "0.9"
tower = { version = "0.5", features = ["util"] }
